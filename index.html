<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Pages</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>公開用練習リポジトリ｜マウスストーカー</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Culpa dolores sint id libero incidunt, totam doloremque
        doloribus soluta natus laborum laudantium exercitationem, unde minus, fugit commodi impedit recusandae! Dolor,
        cumque.</p>

    <div class="particle-layer" aria-hidden="true"></div>

    <script>
        const particleLayer = document.querySelector('.particle-layer');
        const colors = [
            'var(--particle-rich-gold)',
            'var(--particle-bright-gold)',
            'var(--particle-champagne-gold)',
            'var(--particle-light-gold)',
            'var(--particle-light-yellow)',
            'var(--particle-gold-yellow)',
            'var(--particle-lemon-chiffon)',
        ];
        const maxParticles = 900;
        let lastParticleTime = 0;

        function createParticle(x, y, directionX, directionY, pointerX, pointerY) {
            while (particleLayer.childElementCount >= maxParticles) {
                particleLayer.firstElementChild?.remove();
            }

            const particle = document.createElement('span');
            const shapeRoll = Math.random();
            const shape = shapeRoll < 0.14 ? 'particle--diamond' : shapeRoll < 0.22 ? 'particle--spark' : '';
            const size = shape ? 2.4 + Math.random() * 2.4 : 0.9 + Math.random() * 1.9;
            const trailOffset = Math.random() * 6;
            const sideOffset = (Math.random() - 0.5) * 2.4;
            const spreadAngle = Math.random() * Math.PI * 2;
            const spreadDistance = 24 + Math.random() * 38;
            const duration = 1450 + Math.random() * 650;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const particleX = x - directionX * trailOffset - directionY * sideOffset;
            const particleY = y - directionY * trailOffset + directionX * sideOffset;
            const pullX = pointerX - particleX;
            const pullY = pointerY - particleY;
            const pullLength = Math.hypot(pullX, pullY);
            const followDistance = Math.min(pullLength, 38 + Math.random() * 14);
            const followX = pullLength ? (pullX / pullLength) * followDistance : 0;
            const followY = pullLength ? (pullY / pullLength) * followDistance : 0;

            particle.className = `particle ${shape}`.trim();
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.color = color;
            particle.style.left = `${particleX - size / 2}px`;
            particle.style.top = `${particleY - size / 2}px`;
            particleLayer.append(particle);

            const driftX = followX + Math.cos(spreadAngle) * spreadDistance;
            const driftY = followY + Math.sin(spreadAngle) * spreadDistance;
            const animation = particle.animate(
                [
                    { transform: 'translate(0, 0) scale(0.65)', opacity: 0 },
                    { transform: `translate(${followX * 0.35}px, ${followY * 0.35}px) scale(1.1)`, opacity: 1, offset: 0.18, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' },
                    { transform: `translate(${followX}px, ${followY}px) scale(0.9)`, opacity: 0.95, offset: 0.42, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' },
                    { transform: `translate(${followX}px, ${followY}px) scale(1.05)`, opacity: 1, offset: 0.52, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' },
                    { transform: `translate(${followX + driftX * 0.4}px, ${followY + driftY * 0.4}px) scale(0.75)`, opacity: 0.8, offset: 0.76, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' },
                    { transform: `translate(${driftX}px, ${driftY}px) scale(0.2)`, opacity: 0 },
                ],
                { duration, easing: 'linear', fill: 'forwards' },
            );

            animation.onfinish = () => particle.remove();
        }

        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            let previousPointer = null;

            document.addEventListener('pointermove', (event) => {
                const now = performance.now();
                if (now - lastParticleTime < 8) return;

                lastParticleTime = now;
                const movementX = previousPointer ? event.clientX - previousPointer.x : 0;
                const movementY = previousPointer ? event.clientY - previousPointer.y : 0;
                const movementLength = Math.hypot(movementX, movementY);
                const directionX = movementLength ? movementX / movementLength : 0;
                const directionY = movementLength ? movementY / movementLength : 0;
                const startX = previousPointer?.x ?? event.clientX;
                const startY = previousPointer?.y ?? event.clientY;
                const steps = Math.min(40, Math.max(1, Math.ceil(movementLength / 2.5)));

                previousPointer = { x: event.clientX, y: event.clientY };
                for (let step = 1; step <= steps; step += 1) {
                    const progress = step / steps;
                    const particleX = startX + movementX * progress;
                    const particleY = startY + movementY * progress;
                    for (let particleIndex = 0; particleIndex < 3; particleIndex += 1) {
                        createParticle(particleX, particleY, directionX, directionY, event.clientX, event.clientY);
                    }
                }
            });
        }
    </script>
</body>

</html>
